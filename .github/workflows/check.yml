name: check

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14
        with:
          fail-mode: true
      - run: nix build -L .#checks.x86_64-linux.treefmt

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      closures: ${{ steps.plan.outputs.closures }}
      perf: ${{ steps.plan.outputs.perf }}
      skipped: ${{ steps.plan.outputs.skipped }}
      hostChecks: ${{ steps.plan.outputs.hostChecks }}
      descriptions: ${{ steps.plan.outputs.descriptions }}
      cache: ${{ steps.cachix.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - id: cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        continue-on-error: true
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'chore/sync-upstream-')) && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: true
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: nix run .#ci-plan -- "$EVENT_NAME" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.checks != '[]'
    name: build (${{ matrix.check }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        continue-on-error: true
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'chore/sync-upstream-')) && secrets.CACHIX_AUTH_TOKEN || '' }}
          useDaemon: false
          pushFilter: (-source$|-nixos-image-|\.img$|\.iso$|\.img\.zst$|\.qcow2$|-disk-image$|-vm$)
      - env:
          SYSTEM: ${{ matrix.system }}
          CHECK: ${{ matrix.check }}
          BASE_INPUT: ${{ matrix.baseInput }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: nix run .#ci-build -- "$SYSTEM" "$CHECK" results
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.system }}-${{ matrix.check }}
          path: results/${{ matrix.system }}-${{ matrix.check }}.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-${{ matrix.system }}-${{ matrix.check }}
          path: results/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  closure:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.closures != '[]'
    name: closure (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.closures) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        continue-on-error: true
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'chore/sync-upstream-')) && secrets.CACHIX_AUTH_TOKEN || '' }}
          useDaemon: false
          pushFilter: (-source$|-nixos-image-|\.img$|\.iso$|\.img\.zst$|\.qcow2$|-disk-image$|-vm$)
      - env:
          SYSTEM: ${{ matrix.system }}
          BUILD: ${{ matrix.build }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: nix run .#closure-diff -- "$BASE_SHA" > "closure-$SYSTEM.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: closure-${{ matrix.system }}
          path: closure-${{ matrix.system }}.md

  perf:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.perf != '[]'
    name: perf (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.perf) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        continue-on-error: true
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'chore/sync-upstream-')) && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: true
      - env:
          SYSTEM: ${{ matrix.system }}
          BASE_INPUT: ${{ matrix.baseInput }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: nix run .#ci-build -- "$SYSTEM" perf-regression results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-${{ matrix.system }}
          path: results/perf/
          if-no-files-found: ignore
          retention-days: 7

  report:
    if: ${{ !cancelled() }}
    needs: [lint, plan, build, closure, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      RESULTS_DIR: results
      PLANNED: ${{ needs.plan.outputs.checks }}
      SKIPPED: ${{ needs.plan.outputs.skipped }}
      CACHE_OUTCOME: ${{ needs.plan.outputs.cache }}
      LINT_RESULT: ${{ needs.lint.result }}
      PLAN_RESULT: ${{ needs.plan.result }}
      HOST_CHECKS: ${{ needs.plan.outputs.hostChecks }}
      DESCRIPTIONS: ${{ needs.plan.outputs.descriptions }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        continue-on-error: true
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'chore/sync-upstream-')) && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: closure-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-*
          path: results/perf
          merge-multiple: true
      - continue-on-error: true
        run: nix run .#ci-boot-time -- "github:$GITHUB_REPOSITORY/$BASE_SHA" results/base
      - run: nix run .#ci-report > report.md
      - run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      - id: bot
        if: github.event.pull_request.head.repo.full_name == github.repository && vars.BOT_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-pull-requests: write
      - if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: nix run .#ci-report -- --comment | gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - --edit-last --create-if-none

  promote:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.result == 'success' && vars.BOT_CLIENT_ID != '' }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    environment: deploy
    env:
      PLANNED: ${{ needs.plan.outputs.checks }}
      SKIPPED: ${{ needs.plan.outputs.skipped }}
      HOST_CHECKS: ${{ needs.plan.outputs.hostChecks }}
    steps:
      - id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}
          persist-credentials: true
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - env:
          DEPLOY_SIGNING_KEY: ${{ secrets.DEPLOY_SIGNING_KEY }}
        run: nix run .#ci-promote -- results "$GITHUB_SHA"

  badges:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [lint, plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RESULTS_DIR: results
      PLANNED: ${{ needs.plan.outputs.checks }}
      SKIPPED: ${{ needs.plan.outputs.skipped }}
      HOST_CHECKS: ${{ needs.plan.outputs.hostChecks }}
      LINT_RESULT: ${{ needs.lint.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        continue-on-error: true
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'chore/sync-upstream-')) && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - continue-on-error: true
        run: nix run .#ci-boot-time -- "github:$GITHUB_REPOSITORY/$GITHUB_SHA" results/current
      - continue-on-error: true
        run: nix run .#ci-badges -- checks badges
      - continue-on-error: true
        run: nix run .#ci-badges -- publish badges

  ci-ok:
    if: always()
    needs: [lint, plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
