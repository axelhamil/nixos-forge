name: check

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/flake-checker-action@v14
        with:
          fail-mode: true
      - run: nix build -L .#checks.x86_64-linux.treefmt

  plan:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      closures: ${{ steps.plan.outputs.closures }}
      skipped: ${{ steps.plan.outputs.skipped }}
      hostChecks: ${{ steps.plan.outputs.hostChecks }}
      descriptions: ${{ steps.plan.outputs.descriptions }}
      cache: ${{ steps.cachix.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - id: cachix
        uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        continue-on-error: true
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'chore/sync-upstream-')) && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: true
      - id: plan
        run: nix run .#ci-plan -- ${{ github.event_name }} >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.checks != '[]'
    name: build (${{ matrix.check }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        continue-on-error: true
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'chore/sync-upstream-')) && secrets.CACHIX_AUTH_TOKEN || '' }}
          useDaemon: false
          pushFilter: (-source$|-nixos-image-|\.img$|\.iso$|\.img\.zst$|\.qcow2$|-disk-image$|-vm$)
      - run: nix run .#ci-build -- ${{ matrix.system }} ${{ matrix.check }} results ${{ matrix.retry && '--retry' || '' }} ${{ matrix.baseInput && format('--base-input {0} --base github:{1}/{2}', matrix.baseInput, github.repository, github.event.pull_request.base.sha || github.event.before) || '' }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.system }}-${{ matrix.check }}
          path: results/${{ matrix.system }}-${{ matrix.check }}.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: screenshot-${{ matrix.system }}-${{ matrix.check }}
          path: results/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  closure:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.closures != '[]'
    name: closure (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.closures) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        continue-on-error: true
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'chore/sync-upstream-')) && secrets.CACHIX_AUTH_TOKEN || '' }}
          useDaemon: false
          pushFilter: (-source$|-nixos-image-|\.img$|\.iso$|\.img\.zst$|\.qcow2$|-disk-image$|-vm$)
      - run: nix run .#closure-diff -- ${{ github.event.pull_request.base.sha }} ${{ !matrix.build && '--no-build' || '' }} > closure-${{ matrix.system }}.md
      - uses: actions/upload-artifact@v7
        with:
          name: closure-${{ matrix.system }}
          path: closure-${{ matrix.system }}.md

  report:
    if: ${{ !cancelled() }}
    needs: [lint, plan, build, closure]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      RESULTS_DIR: results
      PLANNED: ${{ needs.plan.outputs.checks }}
      SKIPPED: ${{ needs.plan.outputs.skipped }}
      CACHE_OUTCOME: ${{ needs.plan.outputs.cache }}
      LINT_RESULT: ${{ needs.lint.result }}
      PLAN_RESULT: ${{ needs.plan.result }}
      HOST_CHECKS: ${{ needs.plan.outputs.hostChecks }}
      DESCRIPTIONS: ${{ needs.plan.outputs.descriptions }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        continue-on-error: true
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: closure-*
          path: results
          merge-multiple: true
      - continue-on-error: true
        run: nix run .#ci-boot-time -- github:${{ github.repository }}/${{ github.event.pull_request.base.sha || github.event.before }} results/base
      - env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ github.event_name == 'pull_request' && vars.ANTHROPIC_PR_FEDERATION_RULE_ID || github.event_name != 'pull_request' && vars.ANTHROPIC_FEDERATION_RULE_ID || '' }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: nix run .#ci-report > report.md
      - run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      - id: bot
        if: github.event.pull_request.head.repo.full_name == github.repository && vars.BOT_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-pull-requests: write
      - if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ github.event_name == 'pull_request' && vars.ANTHROPIC_PR_FEDERATION_RULE_ID || github.event_name != 'pull_request' && vars.ANTHROPIC_FEDERATION_RULE_ID || '' }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: nix run .#ci-report -- --comment | gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file - --edit-last --create-if-none

  promote:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.result == 'success' && vars.BOT_CLIENT_ID != '' }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    environment: deploy
    env:
      PLANNED: ${{ needs.plan.outputs.checks }}
      SKIPPED: ${{ needs.plan.outputs.skipped }}
      HOST_CHECKS: ${{ needs.plan.outputs.hostChecks }}
    steps:
      - id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - env:
          DEPLOY_SIGNING_KEY: ${{ secrets.DEPLOY_SIGNING_KEY }}
        run: nix run .#ci-promote -- results "$GITHUB_SHA"

  badges:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [lint, plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RESULTS_DIR: results
      PLANNED: ${{ needs.plan.outputs.checks }}
      SKIPPED: ${{ needs.plan.outputs.skipped }}
      HOST_CHECKS: ${{ needs.plan.outputs.hostChecks }}
      LINT_RESULT: ${{ needs.lint.result }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        continue-on-error: true
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - continue-on-error: true
        run: nix run .#ci-boot-time -- github:${{ github.repository }}/${{ github.sha }} results/current
      - continue-on-error: true
        run: nix run .#ci-badges -- checks badges
      - continue-on-error: true
        run: nix run .#ci-badges -- publish badges

  ci-ok:
    if: always()
    needs: [lint, plan, build]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
