name: check

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/flake-checker-action@v14
        with:
          fail-mode: true
      - run: nix build -L .#checks.x86_64-linux.treefmt

  matrix:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.eval.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - id: eval
        run: echo "checks=$(nix eval --json .#ci.matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: needs.matrix.outputs.checks != '[]'
    name: build (${{ matrix.check }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.checks) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: (-source$|-nixos-image-|\.img$|\.img\.zst$|\.qcow2$|-disk-image$|-vm$)
      - uses: nix-community/cache-nix-action@v7
        id: cache
        if: matrix.cache
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('flake.lock', 'modules/hardware/**') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-
          save: ${{ github.event_name == 'push' }}
          purge: ${{ github.event_name == 'push' }}
          purge-prefixes: nix-${{ matrix.system }}-
          purge-created: 0
          purge-primary-key: never
      - if: ${{ !matrix.cache || github.event_name == 'push' || steps.cache.outputs.hit-primary-key == 'true' }}
        run: nix build -L .#checks.${{ matrix.system }}.${{ matrix.check }}
      - if: ${{ matrix.cache && github.event_name != 'push' && steps.cache.outputs.hit-primary-key != 'true' }}
        run: nix eval --raw .#checks.${{ matrix.system }}.${{ matrix.check }}.drvPath

  ci-ok:
    if: always()
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
