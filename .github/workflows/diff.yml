name: diff

on:
  pull_request:

concurrency:
  group: diff-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      systems: ${{ steps.systems.outputs.systems }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - id: systems
        run: echo "systems=$(nix eval --json .#ci.closureMatrix)" >> "$GITHUB_OUTPUT"

  closure:
    needs: matrix
    if: needs.matrix.outputs.systems != '[]'
    name: closure (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.systems) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: nix-community/cache-nix-action@v7
        if: matrix.cache
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('flake.lock', 'modules/hardware/**') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-
          save: false
      - run: nix run .#closure-diff -- ${{ github.event.pull_request.base.sha }} > closure-${{ matrix.system }}.md
      - uses: actions/upload-artifact@v7
        with:
          name: closure-${{ matrix.system }}
          path: closure-${{ matrix.system }}.md

  comment:
    needs: closure
    if: ${{ !cancelled() && needs.closure.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: closure-*
          merge-multiple: true
      - run: cat closure-*.md 2>/dev/null | tee diff.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file diff.md --edit-last --create-if-none
