name: reproducibility

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: reproducibility
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reproducibility:
    if: github.repository == 'axelhamil/nixos-forge' || vars.REPRODUCIBILITY == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        continue-on-error: true
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - run: nix run .#reproducibility > reproducibility.md
      - if: ${{ !cancelled() }}
        run: cat reproducibility.md >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: nix run .#ci-badges -- reproducibility reproducibility.md badges
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: nix run .#ci-badges -- publish badges
