name: reproducibility

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        if: vars.CACHIX_CACHE != ''
        continue-on-error: true
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - run: nix run .#reproducibility > reproducibility.md
      - if: ${{ !cancelled() }}
        run: cat reproducibility.md >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: nix run .#ci-badges -- reproducibility reproducibility.md badges
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: nix run .#ci-badges -- publish badges
