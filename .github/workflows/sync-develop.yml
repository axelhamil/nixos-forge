name: sync-develop

on:
  push:
    branches: [main]

concurrency:
  group: sync-develop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix run .#sync-develop
