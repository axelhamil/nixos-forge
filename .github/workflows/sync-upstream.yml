name: sync-upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  sync:
    if: github.repository != 'axelhamil/nixos-forge' && vars.SYNC_UPSTREAM == 'true'
    runs-on: ubuntu-latest
    steps:
      - id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}
      - uses: cachix/install-nix-action@v31
      - env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          UPSTREAM: ${{ vars.UPSTREAM || 'axelhamil/nixos-forge' }}
        run: nix run .#upstream -- --yes "$UPSTREAM"
