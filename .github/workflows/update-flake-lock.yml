name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - id: update
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          base: main
          branch: chore/update-flake-lock
          commit-msg: "chore: update flake inputs"
          pr-title: "chore: update flake inputs"
          pr-body: |
            Automated changes by the [update-flake-lock](https://github.com/DeterminateSystems/update-flake-lock) GitHub Action.

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```
          token: ${{ steps.bot.outputs.token }}
      - if: steps.update.outputs.pull-request-number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ steps.update.outputs.pull-request-number }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: nix run .#narvi -- pr lock-pr inputs "$PR"
      - if: steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: gh pr merge ${{ steps.update.outputs.pull-request-number }} --auto --squash --delete-branch
