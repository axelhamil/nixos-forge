[package]
name = "forge-ci"
description = "The CI of a nixos-forge flake: plan, build, report, promote, badges, flaky and reproducibility runs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
forge = { path = "../forge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
insta = "1"

[lints]
workspace = true
