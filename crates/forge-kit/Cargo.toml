[package]
name = "forge-kit"
description = "The technical kit of nixos-forge: ports, the machine adapter, processes, signals and OS parsers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
testing = []

[dependencies]
jiff = "0.2"
regex = "1"
rustix = { version = "1", features = ["event", "fs", "process", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.4", default-features = false }
thiserror = "2"
walkdir = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
